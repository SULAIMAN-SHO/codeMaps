<!-- 1. إعلام المتصفح بأن الملف مكتوب بأحدث معايير HTML5 -->
<!DOCTYPE html>

<!-- 2. الوسم الرئيسي الذي يغلف كل الكود -->
<!-- lang="ar": يحدد أن لغة الموقع هي العربية -->
<!-- dir="rtl": يحدد أن اتجاه الصفحة من اليمين إلى اليسار -->
<html lang="ar" dir="rtl">

<!-- 3. قسم الهيد (الكواليس): يحتوي على إعدادات ومعلومات للمتصفح ومحركات البحث ولا يظهر للزائر -->

<head>

    <!-- ضبط ترميز الحروف لدعم اللغة العربية وبقية اللغات بدون إظهار رموز مكسورة -->
    <meta charset="UTF-8">

    <!-- جعل الصفحة متجاوبة وتضبط حجمها تلقائياً مع شاشات الموبايل والتابلت -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- وصف مختصر للموقع يظهر تحت اسم الموقع في نتائج بحث جوجل -->
    <meta name="description" content="هذا هو موقعي الأول لتعلم كيفية بناء صفحات الويب">

    <!-- العنوان الذي يظهر فوق في تبويب المتصفح (Browser Tab) -->
    <title>موقعي الأول</title>

</head>

<!-- 4. قسم البودي (المسرح): هنا نكتب كل ما سيراه الزائر بعينه داخل الشاشة -->

<body>

    <!-- عنوان رئيسي كبير يظهر في أعلى الصفحة -->
    <h1>مرحباً بكم في موقعي الأول!</h1>

    <!-- فقرة نصية عادية تجريبية -->
    <p>هذا النص مكتوب داخل قسم الـ Body وهو أول نص حقيقي يراه الزائر على الشاشة.</p>

</body>

</html>
